<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Versión "maskable": fondo a sangre y dibujo dentro de la zona segura (80% central),
         porque Android lo recorta en círculo o en gota. Sin texto: el nombre ya va debajo del ícono. -->
