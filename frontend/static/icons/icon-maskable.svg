    <g transform="translate(256 256) scale(1.25) translate(-256 -215)">
        <circle cx="256" cy="200" r="100" fill="#e4e2de"/>
        <path d="M290 100 L230 220 L280 220 L240 330 L320 200 L270 200 Z" fill="#bd0606"/>
    </g>
</svg>
