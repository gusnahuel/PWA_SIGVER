# Content Security Policy de la PWA (index.html y sw.js).
#
# El token de sesión vive en localStorage: si alguien lograra inyectar un
# script (XSS), podría robarlo. Esta política hace que el navegador SOLO
# ejecute los scripts propios del servidor, así que un script inyectado no corre.
# Es posible porque la app no tiene scripts en línea, ni onclick="...", ni
# librerías de CDNs (están en static/vendor/).
#
# Si se agrega un servicio externo (otro mapa, una API), hay que sumarlo acá.
set $csp_mapas "https://server.arcgisonline.com https://*.tile.openstreetmap.org";

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: $csp_mapas; font-src 'self'; connect-src 'self' $csp_mapas; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# Por qué cada parte:
#   script-src 'self'         solo scripts de este servidor; nada en línea ni eval
#   style-src 'unsafe-inline' Leaflet y la app usan style="..." (no ejecuta código)
#   img-src data: blob:       vista previa de las fotos antes de enviarlas
#   img-src / connect-src     imágenes de los mapas; connect-src porque el service
#     $csp_mapas              worker las descarga para guardarlas sin señal
#   object-src 'none'         sin plugins (Flash, applets)
#   base-uri / form-action    no se puede redirigir enlaces ni formularios a otro sitio
#   frame-ancestors 'self'    nadie puede mostrar la app dentro de su página
