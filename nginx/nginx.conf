# Compresión: en 3G rural el primer ingreso baja ~60% menos (Leaflet: 147 KB -> ~40 KB).
# Incluye las respuestas de Django (API, admin) que pasan por el proxy.
# Django enmascara el token CSRF en cada respuesta, que es la defensa contra
# el ataque BREACH sobre contenido comprimido con HTTPS.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/css text/plain text/javascript application/javascript
    application/json application/geo+json application/manifest+json
    image/svg+xml font/ttf application/x-font-ttf;

# Caché de /static/:
# - Con ?v= en la URL (archivos de la PWA, versionados por scripts/version.sh):
#   el contenido de esa URL nunca cambia -> un año, "immutable".
# - Sin ?v= (admin de Django, Jazzmin, librerías): el navegador revalida en cada
#   visita y recibe un 304 si no cambió. Así un cambio en el CSS del admin llega
#   enseguida sin tener que renombrar archivos.
map $arg_v $cache_estaticos {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

upstream django {
    server web:8000;
}

# ==========================================
# HTTP en localhost (desarrollo en esta PC)
# El navegador ya trata a localhost como seguro: service worker, GPS y
# cámara funcionan por HTTP, y no hace falta instalar la CA en la PC.
# ==========================================
server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;

    include /etc/nginx/sigver/sigver-app.conf;
}

# ==========================================
# HTTP desde la red (celulares, otras PCs): redirige a HTTPS
# ==========================================
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # CA local de desarrollo, para instalarla en los celulares de prueba
    # (solo el certificado público; la clave privada nunca se sirve).
    # Ver scripts/certificado-local.sh
    location = /sigver-ca.crt {
        alias /etc/nginx/certs/sigver-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    # Validación de Let's Encrypt (para cuando haya dominio en producción)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# HTTPS (puerto 443): celulares de prueba y producción
# Fuera de localhost, el service worker, el GPS y la cámara solo funcionan con HTTPS.
# ==========================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    # Desarrollo: los genera scripts/certificado-local.sh
    # Producción: copiar acá el certificado real con estos mismos nombres
    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/sigver/sigver-app.conf;
}
