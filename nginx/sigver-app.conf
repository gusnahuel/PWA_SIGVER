# Rutas de SIGVER (app, estáticos, API, admin, reportes).
# Las usan el servidor HTTPS y el HTTP de localhost (nginx.conf), así ambos
# se comportan igual. Se edita acá, no en nginx.conf.

client_max_body_size 20M;

root /var/www/frontend;
index index.html;

# ==========================================
# Estáticos (admin Django, DRF, frontend assets)
# ==========================================
location /static/ {
    alias /var/www/static/;
    add_header Cache-Control $cache_estaticos;
    include /etc/nginx/sigver/cabeceras-seguridad.conf;
}

location /media/ {
    alias /var/www/media/;
    expires 7d;
    include /etc/nginx/sigver/cabeceras-seguridad.conf;
}

# ==========================================
# API Django
# ==========================================
location /api/ {
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ==========================================
# Admin Django
# ==========================================
location /admin/ {
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /reportes/ {
    proxy_pass http://django;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# ==========================================
# Todo lo demás: index.html (SPA fallback)
# ==========================================
location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/sigver/cabeceras-seguridad.conf;
    include /etc/nginx/sigver/csp-app.conf;
}
