# Cabeceras de seguridad para lo que sirve nginx directamente (app y estáticos).
# Las respuestas de Django (/api, /admin, /reportes) traen las suyas.
#
# Se incluye en cada "location" que tenga add_header propio, porque nginx
# no hereda los add_header del server en esas locations.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# SAMEORIGIN y no DENY: el admin abre ventanas internas (iframes) del mismo sitio
add_header X-Frame-Options "SAMEORIGIN" always;
# La app usa GPS y cámara; nada más puede pedirlos
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;
