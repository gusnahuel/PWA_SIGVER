# ==========================================
# SIGVER - Docker Compose (desarrollo)
# ==========================================
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: sigver_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sigver_net

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigver_web
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload --timeout 120
    entrypoint: /app/entrypoint.sh
    volumes:
      - ./backend:/app
      - ./frontend/static:/frontend/static:ro
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sigver_net

  nginx:
    image: nginx:alpine
    container_name: sigver_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cabeceras-seguridad.conf:/etc/nginx/sigver/cabeceras-seguridad.conf:ro
      - ./nginx/csp-app.conf:/etc/nginx/sigver/csp-app.conf:ro
      - ./nginx/sigver-app.conf:/etc/nginx/sigver/sigver-app.conf:ro
      # Certificados HTTPS (scripts/certificado-local.sh en desarrollo)
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend:/var/www/frontend:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - web
    networks:
      - sigver_net

volumes:
  pgdata:
  media_data:
  static_data:

networks:
  sigver_net:
    driver: bridge
